name: Build and Push to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nginx/**'
      - 'php-fpm/**'
      - '.github/workflows/build.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-php-fpm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./php-fpm
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/php-fpm:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/php-fpm:8.3
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nginx:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nginx:1.27
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
